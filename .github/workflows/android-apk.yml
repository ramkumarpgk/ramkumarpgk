name: Build Android APK

# Builds an installable .apk on GitHub's servers (free, no Expo or Play Store account).
# - Every run: the APK is attached to the run under "Artifacts".
# - Pushes to main: the APK is also published as the "android-latest" GitHub Release,
#   so you can download it straight onto a phone.
#
# Optional: set a repository variable API_URL (Settings → Secrets and variables →
# Actions → Variables) to bake your server address into the app.

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk family-calendar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: family-calendar-apk
          path: mobile/family-calendar.apk
          retention-days: 30

      - name: Publish "android-latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest family-calendar.apk \
            --title "Family Calendar for Android (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. On your Android phone: download family-calendar.apk, open it, and allow installing from this source." \
            --target "$GITHUB_SHA"
